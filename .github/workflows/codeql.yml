name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

# htmlayout parses untrusted HTML/CSS text into a box tree and then does a lot
# of hand-rolled pointer and index work laying it out — the tokenizer, the
# cascade, the flex/grid track arithmetic. That is exactly the surface where an
# off-by-one or an unchecked cast turns into an out-of-bounds read, and where a
# checker earns its keep. The vendored gumbo parser is extracted too (it is C
# compiled into the same build), which is fine — it is another untrusted-input
# parser worth scanning.
jobs:
  analyze:
    name: Analyze C++
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended

      # Debug / -O0 keeps the extracted IR close to the source so dataflow paths
      # in the results point at code a human can act on.
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          cmake --build build --parallel 4

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:c-cpp
